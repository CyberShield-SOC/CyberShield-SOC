providers = ["python", "node"]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv",
  "/opt/venv/bin/pip install -r backend/requirements.txt",
  "npm --prefix frontend ci"
]
paths = ["/opt/venv/bin"]

[phases.build]
cmds = [
  "npm --prefix frontend run build"
]

[start]
cmd = "cd backend && /opt/venv/bin/python -m alembic upgrade head && /opt/venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
